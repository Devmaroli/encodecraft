# Build EncodeCraft-Setup-x64.exe and EncodeCraft-Portable-x64.zip on a version tag.
# Push a tag such as v0.2.0 to GitHub (https://github.com/Devmaroli/encodecraft).

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache FFmpeg download
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: ffmpeg-windows-essentials

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        shell: bash
        run: echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Build release binaries
        run: cargo build --release -p encodecraft -p encodecraft-cli

      - name: Package installer and portable zip
        shell: bash
        env:
          SKIP_BUILD: "1"
        run: ./scripts/package-windows.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: encodecraft-windows-x64
          path: |
            dist/EncodeCraft-Setup-x64.exe
            dist/EncodeCraft-Portable-x64.zip
            dist/SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EncodeCraft-Setup-x64.exe
            dist/EncodeCraft-Portable-x64.zip
            dist/SHA256SUMS
