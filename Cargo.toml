[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/storytold/effectcraft"
publish = false

[workspace.dependencies]
encodecraft-job = { path = "crates/job" }
encodecraft-presets = { path = "crates/presets" }
encodecraft-ffmpeg = { path = "crates/ffmpeg" }
encodecraft-queue = { path = "crates/queue" }
encodecraft-engine = { path = "crates/engine" }
encodecraft-ui-egui = { path = "crates/ui-egui" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
env_logger = "0.11"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

egui = "0.32"
eframe = { version = "0.32", default-features = false }
rfd = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
